name: techsisters
description: "TechSisters - Mobile app for coding and AI literacy for girls in East Africa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.1
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  google_sign_in: ^6.1.5

  # UI & Validation
  email_validator: ^2.1.17

  # Networking & Storage
  dio: ^5.3.1
  shared_preferences: ^2.5.6
  cloud_firestore: ^4.17.5
  bloc_concurrency: ^0.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^9.1.0
  mocktail: ^1.0.0
  fake_cloud_firestore: ^2.5.2

flutter:
  uses-material-design: true