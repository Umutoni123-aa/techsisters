name: techsisters
description: "TechSisters - Mobile app for coding and AI literacy for girls in East Africa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.1
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: 4.20.0
  google_sign_in: ^6.1.5

  # UI & Validation
  email_validator: ^2.1.17

  # Networking & Storage
  dio: ^5.3.1
  cloud_firestore: 4.17.5
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^9.1.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true